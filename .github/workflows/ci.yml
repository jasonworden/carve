name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job here only reads the repo; nothing publishes or comments.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: spec-corpus conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor tracks @markup-carve/carve's `engines` field (">=20"),
        # not Node's EOL calendar: 20 is past end-of-life, but it is still
        # the oldest runtime the package promises to work on, so the
        # reference implementation has to be shown conformant there. Raise
        # this leg only when carve-js raises `engines`.
        #
        # The ceiling is this repo's own contribution. carve-js declares
        # ">=20" but its matrix stops at 22, so 24 (Active LTS) and 26
        # (Current) are unverified anywhere else.
        #
        # 26 gates like every other leg rather than running
        # continue-on-error: these steps are the corpus, the formal Core
        # grammar and the pinned reference build, so a red leg is a real
        # conformance signal — and a spec repo wants to hear that loudly. If
        # a future Node genuinely breaks a toolchain rather than the spec,
        # demote that leg then, with the breakage on record.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Installs ohm-js (the executable spec) and the pinned
      # `@markup-carve/carve` reference build the conformance steps render
      # through. The pin is an exact carve-js commit in package.json.
      - name: Install
        run: npm ci

      # Regenerate the corpus from docs/examples.md and fail if it
      # drifted from what is committed — keeps examples and fixtures
      # in lockstep.
      - name: Corpus is in sync with examples
        run: |
          npm run corpus:build
          git diff --exit-code -- tests/corpus tests/spec

      # Corpus conformance runs through the EXECUTABLE SPEC (scripts/spec), so
      # this gate does not wait for an engine to ship a rule. The pinned
      # carve-js build still backs the Tier-2, round-trip, prose-example and
      # render-option suites in the same run.
      - name: Conformance
        run: npm test

      - name: Executable-spec gate (formal Core grammar vs corpus)
        run: npm run core:check

      # The pinned reference build vs the corpus. NOT a gate on drift -- the
      # corpus is deliberately allowed to run ahead of the engine, and gating
      # on the mismatch itself would reinstate exactly the deadlock
      # scripts/engine-report.mjs exists to document.
      #
      # This gates on the drift being DECLARED. resources/engine-pin-drift.txt
      # names the slugs the pin is knowingly behind on and why; a spec PR that
      # puts the corpus ahead adds a line there and stays green. Undeclared
      # drift, and lines the pin has caught up on, both go red.
      #
      # It ran in no job at all until now, which is how carve#533 found the
      # pinned build three documents behind with nothing reporting it.
      - name: Pinned reference build matches its declared drift
        run: npm run engine:report -- --check

  docs-build:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Build the VitePress site so a broken doc (e.g. unescaped Vue
      # interpolation) fails the PR instead of only the Pages deploy.
      - run: npm run docs:build

  mermaid-lint:
    name: mermaid diagrams valid
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Validate every Mermaid diagram embedded in tracked docs, including the
      # ```mermaid blocks inside .crv sources, so a broken diagram fails the PR
      # instead of silently rendering as an error in the browser. Discovery and
      # strictness are configured in mermaid-lint.config.js.
      - run: npm run lint:mermaid
